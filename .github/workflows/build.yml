name: Compilar app para Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Clonar repo
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias del frontend
        run: npm install

      # En tags: crea un draft release con el instalador
      # En push a main / manual: solo compila y sube artifact
      - name: Compilar app de Windows (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: "MiniTube Player ${{ github.ref_name }}"
          releaseBody: |
            Instalador de Windows generado automáticamente.

            **Novedades v1.2**
            - Al abrir: ventana compacta (lista + mini player)
            - Arrastrá al borde derecho → modo lateral compacto
            - Auto-ocultar en el borde del monitor
          releaseDraft: true
          prerelease: false

      - name: Subir instaladores como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniTube-Player-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
